<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PK AI Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>PK AI Tool</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" data-i18n="newChat">+ New Chat</button>

      <div class="section-title" data-i18n="recentChats">Recent Chats</div>
      <ul class="nav-list" id="historyList">
        <li class="nav-item active" data-i18n="defaultWorkspace">Main Workspace</li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <div class="lang-box">
        <label for="languageSelect" class="section-title" data-i18n="languageLabel">Language</label>
        <select id="languageSelect" class="lang-select">
          <option value="auto">Auto Detect (System)</option>
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="hi">Hindi</option>
          <option value="ar">Arabic</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="zh">Chinese</option>
        </select>
      </div>
      <div class="nav-item" id="guidesBtn" data-i18n="guides">Guides & Help</div>
      <div class="nav-item" id="settingsBtn" data-i18n="settings">Account Settings</div>
    </div>
  </aside>

  <main class="main-area">
    <header class="top-bar">
      <div class="top-left">
        <button class="menu-btn" id="toggleMenuBtn">Menu</button>
        <span class="top-title">PK AI Tool</span>
      </div>
      <div class="top-right">
        <span class="plan-badge" id="planBadge">Free Plan • 10 Points</span>
      </div>
    </header>

    <section class="chat-container" id="chatContainer">
      <div class="welcome-card" id="welcomeCard">
        <h1 data-i18n="welcomeTitle">Welcome to PK AI Tool</h1>
        <p data-i18n="welcomeSubtitle">Universal AI workspace supporting global languages, media, and tools.</p>
      </div>
    </section>

    <div class="input-wrapper">
      <div class="input-box">
        <input type="file" id="fileInput" hidden multiple />
        <button class="icon-btn" id="plusBtn" title="Attach Files">+</button>
        <input
          type="text"
          class="prompt-input"
          id="promptInput"
          data-i18n-placeholder="inputPlaceholder"
          placeholder="Ask anything in any language..."
        />
        <button class="icon-btn" id="micBtn" title="Voice Input">Mic</button>
        <button class="send-btn" id="sendBtn" data-i18n="send">Send</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
